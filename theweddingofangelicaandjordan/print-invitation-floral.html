<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Wedding Invitation — 5R Print (Floral)</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=Great+Vibes&family=Julius+Sans+One&family=Raleway:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
@font-face{
  font-family:'Quadrian';
  src:url('assets/fonts/Quadrian.otf') format('opentype');
  font-weight:normal;
  font-style:normal;
}
@font-face{
  font-family:'Quadrian Ornament';
  src:url('assets/fonts/Quadrian Ornament.otf') format('opentype');
  font-weight:normal;
  font-style:normal;
}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
@page{size:5in 7in;margin:0}
body{
  font-family:'Raleway',sans-serif;
  background:#e8e4dc;
  display:flex;
  justify-content:center;
  align-items:center;
  min-height:100vh;
  padding:24px;
  -webkit-font-smoothing:antialiased;
}
.card{
  width:5in;height:7in;
  position:relative;
  overflow:hidden;
  display:flex;
  flex-direction:column;
  align-items:center;
  text-align:center;
}
.bg{
  position:absolute;
  inset:0;
  background:url('watercolor-bg.png') center/cover no-repeat;
  z-index:0;
}
.bg::after{
  content:'';
  position:absolute;
  inset:0;
  background:rgba(245,240,230,0.3);
}
.floral{
  position:absolute;
  width:65%;
  z-index:2;
  pointer-events:none;
}
.floral img{
  width:100%;
  display:block;
}
.floral-tl{
  top:-20px;
  left:-30px;
  transform:rotate(180deg);
}
.floral-br{
  bottom:-20px;
  right:-30px;
}
.floral-gold{
  position:absolute;
  width:38%;
  z-index:2;
  pointer-events:none;
}
.floral-gold img{width:100%;display:block}
.floral-tr{
  top:-20px;
  right:-30px;
}
.floral-bl{
  bottom:-20px;
  left:-30px;
  transform:rotate(180deg);
}
.content{
  position:relative;
  z-index:3;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  flex:1;
  padding:0.8in 0.6in 0.7in;
  width:100%;
}
.monogram{
  width:210px;
  margin-bottom:12px;
}
.monogram img{
  width:100%;height:auto;
  display:block;
  filter:brightness(0) saturate(100%) invert(20%) sepia(15%) saturate(1200%) hue-rotate(100deg) brightness(95%);
}
.names{
  font-family:'Great Vibes',cursive;
  font-size:40px;
  color:#0e2418;
  line-height:1.15;
}
.ampersand{
  font-family:'Cormorant Garamond',serif;
  font-size:18px;
  font-weight:500;
  font-style:italic;
  color:#8baa98;
  display:block;
  margin:2px 0;
}
.divider{
  width:50px;
  height:1px;
  background:linear-gradient(90deg,transparent,#c9a84c,transparent);
  margin:12px auto;
}
.subtitle{
  font-size:8px;
  font-weight:700;
  letter-spacing:0.3em;
  text-transform:uppercase;
  color:#8baa98;
  margin-bottom:4px;
}
.date-wrap{
  margin-top: 5px;
  display:flex;
  flex-direction:column;
  align-items:center;
  margin-bottom:16px;
}
.date-top{
  font-family:'Raleway',sans-serif;
  font-size:7px;
  font-weight:600;
  letter-spacing:0.2em;
  text-transform:uppercase;
  color:#5a7a68;
  margin-bottom:6px;
}
.date-row{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:20px;
  border:1px solid #bcc8c0;
  height:20px;
  padding:0 28px;
  position:relative;
  overflow:visible;
  margin-top: 5px;
}
.date-left,.date-right{
  font-family:'Raleway',sans-serif;
  font-size:8.5px;
  font-weight:700;
  letter-spacing:0.25em;
  text-transform:uppercase;
  color:#2a2a2a;
}
.date-circle{
  width:34px;height:34px;
  border-radius:50%;
  background:#1a3a2a;
  display:flex;
  align-items:center;
  justify-content:center;
  flex-shrink:0;
}
.date-circle span{
  font-family:serif;
  font-size:16px;
  font-weight:700;
  color:#fff;
  line-height:1;
}
.venue-block{margin-bottom:12px}
.venue-type{
  font-size:7px;
  font-weight:700;
  letter-spacing:0.3em;
  text-transform:uppercase;
  color:#8baa98;
  margin-bottom:2px;
}
.venue-name{
  font-family:'Cormorant Garamond',serif;
  font-size:14px;
  font-weight:700;
  color:#0e2418;
  margin-bottom:1px;
}
.venue-detail{
  font-size:8.5px;
  font-weight:600;
  color:#5a7a68;
  line-height:1.5;
}
.dresscode{
  margin-top:4px;
  padding-top:10px;
}
.dresscode-label{
  font-size:7px;
  font-weight:600;
  letter-spacing:0.3em;
  text-transform:uppercase;
  color:#c9a84c;
  margin-bottom:3px;
}
.dresscode-text{
  font-family:'Cormorant Garamond',serif;
  font-size:10.5px;
  font-weight:400;
  font-style:italic;
  color:#1a3a2a;
  line-height:1.5;
}
.seal{
  position:absolute;
  bottom:24px;
  width:48px;height:48px;
  z-index:3;
}
.seal img{width:100%;height:100%;object-fit:contain}
@media print{
  body{background:none;padding:0;min-height:auto}
}
</style>
</head>
<body>
<div class="card">
  <div class="bg"></div>

  <div class="floral floral-tl">
    <img src="floral-hero.png" alt="">
  </div>
  <div class="floral floral-br">
    <img src="floral-hero.png" alt="">
  </div>
  <div class="floral-gold floral-tr">
    <img src="floral-accent.png" alt="">
  </div>
  <div class="floral-gold floral-bl">
    <img src="floral-accent.png" alt="">
  </div>

  <div class="content">
    <div class="monogram">
      <img src="monogram.png" alt="A&J">
    </div>

    <p class="subtitle">Together with their families</p>

    <h1 class="names">
      Angelica
      <span class="ampersand">&amp;</span>
      Jordan
    </h1>

    <div class="divider"></div>

    <p class="subtitle">Invite you to celebrate their union</p>

    <div class="date-wrap">
      <span class="date-top">on Friday</span>
      <div class="date-row">
        <span class="date-left">NOV</span>
        <div class="date-circle"><span>27</span></div>
        <span class="date-right">2026</span>
      </div>
    </div>

    <div class="venue-block">
      <p class="venue-type">Ceremony &middot; 10:00 AM</p>
      <p class="venue-name">St. John Nepomucene</p>
      <p class="venue-detail">Mojica, Alfonso, Cavite</p>
    </div>

    <div class="venue-block">
      <p class="venue-type">Reception &middot; 1:00 PM</p>
      <p class="venue-name">Maharlika Events Tagaytay</p>
      <p class="venue-detail">Tagaytay-Nasugbu Hwy, Laurel, Batangas</p>
    </div>

  </div>


</div>
</body>
</html>
