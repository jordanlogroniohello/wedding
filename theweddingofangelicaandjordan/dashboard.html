<script>
try{screen.orientation.lock('landscape').catch(function(){});}catch(e){}
var sb=supabase.createClient('https://twcynoszygedohyoqftu.supabase.co','sb_publishable_FAwCKHnzhIFI2_at0KubEw_msQfc6yF');
var guests=[],sFilter='confirmed',cFilter='all',query='',adminPw=null;
var catLabel={ps:'VIP / Sponsor',e:'Entourage',f:'Family',g:'Guest'};
var catOrder={ps:0,f:1,e:2,g:3};
var statusColors={
  confirmed:'bg-emerald-50 text-emerald-600',
  declined:'bg-red-50 text-red-500',
  pending:'bg-amber-50 text-amber-600',
  checkedin:'bg-blue-50 text-blue-600'
};
var statusActive={
  all:'bg-gray-800 text-white',
  confirmed:'bg-emerald-600 text-white',
  declined:'bg-red-500 text-white',
  pending:'bg-amber-500 text-white',
  checkedin:'bg-blue-600 text-white'
};
var catActive={
  all:'bg-gray-800 text-white',
  ps:'bg-slate-600 text-white',
  f:'bg-amber-700 text-white',
  e:'bg-emerald-600 text-white',
  g:'bg-slate-500 text-white'
};
var avatarBg={ps:'bg-slate-600',e:'bg-emerald-600',f:'bg-amber-800',g:'bg-gray-400'};

// ─── Offline sync ───
var CACHE_KEY='wed_guests';
var QUEUE_KEY='wed_checkin_queue';

function getQueue(){try{return JSON.parse(localStorage.getItem(QUEUE_KEY))||[];}catch(e){return[];}}
function saveQueue(q){try{localStorage.setItem(QUEUE_KEY,JSON.stringify(q));}catch(e){}}
function cacheGuests(){try{localStorage.setItem(CACHE_KEY,JSON.stringify(guests));}catch(e){}}
function getCachedGuests(){try{return JSON.parse(localStorage.getItem(CACHE_KEY))||[];}catch(e){return[];}}

function setSyncStatus(state){
  var dot=document.getElementById('syncDot');
  var label=document.getElementById('syncLabel');
  if(state==='synced'){dot.className='w-2 h-2 rounded-full bg-emerald-400';label.textContent='Synced';}
  else if(state==='pending'){dot.className='w-2 h-2 rounded-full bg-amber-400 animate-pulse';label.textContent=getQueue().length+' pending';}
  else{dot.className='w-2 h-2 rounded-full bg-red-400';label.textContent='Offline';}
}

async function flushQueue(){
  var q=getQueue();
  if(!q.length)return;
  var remaining=[];
  for(var i=0;i<q.length;i++){
    var r=await sb.from('checkins').insert({guest_id:q[i].guest_id,checked_in_by:'dashboard'}).select().single();
    if(r.error)remaining.push(q[i]);
  }
  saveQueue(remaining);
  setSyncStatus(remaining.length?'pending':'synced');
  if(!remaining.length)load();
}

async function load(){
  try{
    var g=await sb.from('guests').select('*');
    if(g.error)throw g.error;
    var r=await sb.from('rsvps').select('guest_id,attending,message,submitted_at');
    var c=await sb.from('checkins').select('guest_id,checked_in_at');
    var v=await sb.from('views').select('guest_id,viewed_at');
    var n=await sb.from('guest_notes').select('guest_id,notes');
    var nm={};(n.data||[]).forEach(function(x){nm[x.guest_id]=x.notes;});
    var rm={};(r.data||[]).forEach(function(x){
      if(!rm[x.guest_id]||x.submitted_at>rm[x.guest_id].submitted_at)rm[x.guest_id]=x;
    });
    var cm={};(c.data||[]).forEach(function(x){cm[x.guest_id]=x;});
    allViewsData=v.data||[];
    var vm={};var vc={};(v.data||[]).forEach(function(x){
      vc[x.guest_id]=(vc[x.guest_id]||0)+1;
      if(!vm[x.guest_id]||x.viewed_at>vm[x.guest_id].viewed_at)vm[x.guest_id]=x;
    });
    var localQueue=getQueue();
    var queueIds={};localQueue.forEach(function(x){queueIds[x.guest_id]=true;});
    guests=(g.data||[]).map(function(g){
      var rv=rm[g.id]||null,ci=cm[g.id]||null;
      var st=ci||queueIds[g.id]?'checkedin':rv?(rv.attending?'confirmed':'declined'):'pending';
      return{id:g.id,gid:g.guest_id,name:g.full_name,display:g.display_name,cat:g.category,
        table:g.table_number,status:st,msg:rv?rv.message:null,msgAt:rv?rv.submitted_at:null,
        checkedAt:ci?ci.checked_in_at:null,
        viewed:!!vm[g.id],viewCount:vc[g.id]||0,lastView:vm[g.id]?vm[g.id].viewed_at:null,
        notes:nm[g.id]||''};
    });
    sortGuests();
    cacheGuests();
    setSyncStatus(localQueue.length?'pending':'synced');
    if(localQueue.length)flushQueue();
  }catch(e){
    guests=getCachedGuests();
    if(!guests.length){document.getElementById('tbody').innerHTML='<tr><td colspan="5" class="px-5 py-16 text-center text-red-400">Offline — no cached data</td></tr>';setSyncStatus('offline');return;}
    setSyncStatus(getQueue().length?'pending':'offline');
  }
  stats();render();updateBadges();
}

function sortGuests(){
  guests.sort(function(a,b){
    var co=catOrder[a.cat]-catOrder[b.cat];
    return co!==0?co:a.name.localeCompare(b.name);

}

var ciGuest=null;
function initials(name){return name.split(' ').map(function(w){return w[0]}).join('').substring(0,2).toUpperCase();}

function askCheckin(id){
  var g=guests.find(function(x){return x.id===id});
  if(!g||g.status!=='confirmed')return;
  ciGuest=g;
  var av=document.getElementById('ciAvatar');
  av.className='w-12 h-12 rounded-xl mx-auto mb-3 flex items-center justify-center text-white text-sm font-bold '+avatarBg[g.cat];
  av.textContent=initials(g.name);
  document.getElementById('ciName').textContent=g.name;
  document.getElementById('ciInfo').textContent=(g.table?'Table '+g.table:'No table yet')+' · '+catLabel[g.cat];
  showErr('ciErr','');
  var btn=document.getElementById('ciConfirm');
  btn.disabled=false;btn.textContent='Yes, check in';
  openModal('ciModal');
}

document.getElementById('ciConfirm').addEventListener('click',async function(){
  var g=ciGuest;
  if(!g)return;
  if(g.status==='checkedin'){showErr('ciErr',g.name+' is already checked in.');return;}
  this.disabled=true;this.textContent='Checking in...';
  await checkin(g.id);
  ciGuest=null;
  closeModal('ciModal');
  closeModal('detailModal');
});

async function checkin(id){
  var g=guests.find(function(x){return x.id===id});
  try{
    var r=await sb.from('checkins').insert({guest_id:id,checked_in_by:'dashboard'}).select().single();
    if(r.error)throw r.error;
    if(g)g.checkedAt=r.data.checked_in_at;
  }catch(e){
    var q=getQueue();
    q.push({guest_id:id,ts:Date.now()});
    saveQueue(q);
    setSyncStatus('pending');
    if(g)g.checkedAt=new Date().toISOString();
  }
  if(g)g.status='checkedin';
  cacheGuests();
  stats();render();
}

function timeAgo(ts){
  if(!ts)return '';
  var d=Math.floor((Date.now()-new Date(ts).getTime())/1000);
  if(d<60)return 'just now';
  if(d<3600)return Math.floor(d/60)+'m ago';
  if(d<86400)return Math.floor(d/3600)+'h ago';
  return Math.floor(d/86400)+'d ago';
}

function formatDate(ts){
  var d=new Date(ts);
  var months=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  var h=d.getHours(),m=d.getMinutes(),ampm=h>=12?'PM':'AM';
  h=h%12||12;
  return months[d.getMonth()]+' '+d.getDate()+', '+d.getFullYear()+' — '+h+':'+(m<10?'0':'')+m+' '+ampm;
}

// Guest ID = first name with vowels as numbers + 2 random letters, e.g. alleah → 4ll34hxc
function makeGid(name){
  var first=(name.trim().split(/\s+/)[0]||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/[^a-z]/g,'');
  var map={a:'4',e:'3',i:'1',o:'0',u:'5'};
  var base=first.replace(/[aeiou]/g,function(c){return map[c];});
  var taken={};guests.forEach(function(g){taken[(g.gid||'').toLowerCase()]=true;});
  var letters='abcdefghijklmnopqrstuvwxyz',id;
  do{id=base+letters[Math.floor(Math.random()*26)]+letters[Math.floor(Math.random()*26)];}while(taken[id]);
  return id;
}

function updateLink(){
  var gid=document.getElementById('fGid').value.trim();
  document.getElementById('fLink').textContent=gid?INVITE_BASE+gid:'';
}

function openGuestModal(g){
  editing=g||null;
  gidTouched=false;displayTouched=!!g;
  document.getElementById('guestModalTitle').textContent=g?'Edit guest':'Add guest';
  document.getElementById('fName').value=g?g.name:'';
  document.getElementById('fDisplay').value=g?(g.display||g.name):'';
  document.getElementById('fCat').value=g?g.cat:'g';
  document.getElementById('fTable').value=g&&g.table?g.table:'';

  var st=document.getElementById('fStatus');
  var replied=g&&g.status!=='pending';
  st.value=!g||g.status==='pending'?'':(g.status==='declined'?'declined':'confirmed');
  st.querySelector('option[value=""]').disabled=!!replied;
  st.disabled=!!(g&&g.status==='checkedin');
  document.getElementById('fNotes').value=g?(g.notes||''):'';

  var gidEl=document.getElementById('fGid');
  gidEl.value=g?g.gid:'';
  gidEl.readOnly=!!g;
  updateLink();

  document.getElementById('delGuestBtn').classList.toggle('hidden',!g);
  showErr('guestErr','');
  openModal('guestModal');
  document.getElementById('fName').focus();
}

document.getElementById('addGuestBtn').addEventListener('click',function(){openGuestModal(null);});

document.getElementById('fName').addEventListener('input',function(){
  if(editing)return;
  var name=this.value;
  if(!displayTouched)document.getElementById('fDisplay').value=name;
  if(!gidTouched){document.getElementById('fGid').value=name.trim()?makeGid(name):'';updateLink();}
});
document.getElementById('fDisplay').addEventListener('input',function(){displayTouched=true;});
document.getElementById('fGid').addEventListener('input',function(){gidTouched=true;updateLink();});

function adminError(err){
  if(/Wrong admin password/.test(err.message)){setAdmin(null);return 'Admin password no longer valid — unlock again.';}
  if(err.code==='23505')return 'That guest ID is already used. Change it and save again.';
  return err.message;
}

document.getElementById('guestForm').addEventListener('submit',async function(e){
  e.preventDefault();
  var btn=document.getElementById('guestSubmit');
  btn.disabled=true;btn.textContent='Saving...';
  var r=await sb.rpc('admin_save_guest',{
    p_password:adminPw,
    p_id:editing?editing.id:null,
    p_guest_id:document.getElementById('fGid').value.trim(),
    p_full_name:document.getElementById('fName').value.trim(),
    p_display_name:document.getElementById('fDisplay').value.trim(),
    p_category:document.getElementById('fCat').value,
    p_table_number:document.getElementById('fTable').value.trim(),
    p_status:document.getElementById('fStatus').disabled?null:(document.getElementById('fStatus').value||null),
    p_notes:document.getElementById('fNotes').value.trim()
  });
  btn.disabled=false;btn.textContent='Save';
  if(r.error){showErr('guestErr',adminError(r.error));return;}
  closeModal('guestModal');
  load();
});

document.getElementById('delGuestBtn').addEventListener('click',async function(){
  if(!editing)return;
  if(!confirm('Delete '+editing.name+'? Their RSVP, message, views and check-in are removed too.'))return;
  var btn=this;
  btn.disabled=true;btn.textContent='Deleting...';
  var r=await sb.rpc('admin_delete_guest',{p_password:adminPw,p_id:editing.id});
  btn.disabled=false;btn.textContent='Delete';
  if(r.error){showErr('guestErr',adminError(r.error));return;}
  closeModal('guestModal');
  load();
});

try{if(sessionStorage.getItem(ADMIN_KEY))setAdmin(sessionStorage.getItem(ADMIN_KEY));}catch(e){}
</script>
