<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Guest List — Angelica & Jordan</title>
<link rel="manifest" href="manifest.json">

<link rel="icon" type="image/png" href="favicon.png">

tailwind.config = {
  theme: {
    extend: {
      colors: {
        wed: { 50:'#f0f7f2', 100:'#d8f3dc', 200:'#b7e4c7', 400:'#52b788', 500:'#2d6a4f', 600:'#1b4332', 700:'#0e2418' },
        warm: { 50:'#faf8f5', 100:'#f5f2ed', 200:'#eae6e0', 300:'#d4cfc7' }

<body class="bg-warm-100 min-h-screen font-sans text-gray-800 antialiased">

<!-- ═══ HERO BANNER ═══ -->
<header class="bg-gradient-to-br from-wed-500 via-wed-600 to-wed-700 text-white relative overflow-hidden">
  <div class="absolute inset-0 opacity-[0.07]" style="background-image:url('floral-hero.png');background-size:300px;background-position:top left"></div>
  <div class="absolute inset-0 opacity-[0.07]" style="background-image:url('floral-hero.png');background-size:300px;background-position:bottom right;transform:rotate(180deg)"></div>
  <div class="relative z-10 max-w-5xl mx-auto px-6 py-8 flex flex-col sm:flex-row items-center sm:justify-between gap-4 text-center sm:text-left">
    <div class="flex flex-col sm:flex-row items-center gap-3 sm:gap-5">
      <img src="monogram.png" alt="A&J" class="h-10 sm:h-14 brightness-0 invert">
      <div>
        <h1 class="font-script text-3xl sm:text-4xl tracking-wide">Angelica & Jordan</h1>
        <p class="font-serif text-xs sm:text-sm tracking-[3px] uppercase text-white/90 mt-1">November 27, 2026</p>
      </div>
    </div>
    <div class="text-right">
      <div class="font-serif text-[10px] sm:text-xs tracking-[2px] uppercase text-white/90">Wedding Guest List</div>
      <div id="syncStatus" class="flex items-center justify-end gap-1.5 mt-1.5">
        <span id="syncDot" class="w-2 h-2 rounded-full bg-emerald-400"></span>
        <span id="syncLabel" class="text-[9px] text-white/60 uppercase tracking-wider">Synced</span>
      </div>
    </div>
  </div>
</header>

<main class="max-w-5xl mx-auto px-4 sm:px-6 py-4 sm:py-6">

  <!-- ═══ STATS ═══ -->
  <div class="grid grid-cols-2 sm:grid-cols-5 gap-3 mb-6" id="stats">
    <div class="bg-white rounded-2xl p-5 shadow-sm text-center">
      <div class="text-3xl font-bold text-gray-800" id="sT">—</div>
      <div class="text-[10px] font-semibold text-gray-400 uppercase tracking-widest mt-1">Total</div>
    </div>
    <div class="bg-white rounded-2xl p-5 shadow-sm text-center">
      <div class="text-3xl font-bold text-emerald-600" id="sC">—</div>
      <div class="text-[10px] font-semibold text-gray-400 uppercase tracking-widest mt-1">Going</div>
    </div>
    <div class="bg-white rounded-2xl p-5 shadow-sm text-center">
      <div class="text-3xl font-bold text-red-500" id="sD">—</div>
      <div class="text-[10px] font-semibold text-gray-400 uppercase tracking-widest mt-1">Declined</div>
    </div>
    <div class="bg-white rounded-2xl p-5 shadow-sm text-center">
      <div class="text-3xl font-bold text-amber-500" id="sP">—</div>
      <div class="text-[10px] font-semibold text-gray-400 uppercase tracking-widest mt-1">Pending</div>
    </div>
    <div class="bg-white rounded-2xl p-5 shadow-sm text-center">
      <div class="text-3xl font-bold text-violet-500" id="sV">—</div>
      <div class="text-[10px] font-semibold text-gray-400 uppercase tracking-widest mt-1">Viewed</div>
    </div>
  </div>

  <!-- ═══ SEARCH + FILTERS ═══ -->
  <div class="bg-white rounded-2xl shadow-sm p-4 mb-6">
    <div class="relative mb-3">
      <svg class="absolute left-3 top-1/2 -translate-y-1/2 text-gray-300" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input type="text" id="q" placeholder="Search guests..." class="w-full pl-10 pr-4 py-3 bg-warm-50 border border-warm-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-wed-400/30 focus:border-wed-400 transition">
    </div>
    <div class="flex gap-2 flex-wrap">
      <button data-filter="status" data-v="all" class="active px-3.5 py-1.5 rounded-lg text-xs font-semibold bg-gray-800 text-white transition">All</button>
      <button data-filter="status" data-v="confirmed" class="px-3.5 py-1.5 rounded-lg text-xs font-semibold bg-warm-100 text-gray-400 hover:bg-emerald-50 hover:text-emerald-600 transition">Going</button>
      <button data-filter="status" data-v="declined" class="px-3.5 py-1.5 rounded-lg text-xs font-semibold bg-warm-100 text-gray-400 hover:bg-red-50 hover:text-red-500 transition">Declined</button>
      <button data-filter="status" data-v="pending" class="px-3.5 py-1.5 rounded-lg text-xs font-semibold bg-warm-100 text-gray-400 hover:bg-amber-50 hover:text-amber-600 transition">Pending</button>
      <button data-filter="status" data-v="checkedin" class="px-3.5 py-1.5 rounded-lg text-xs font-semibold bg-warm-100 text-gray-400 hover:bg-blue-50 hover:text-blue-600 transition">Checked In</button>
      <span class="w-px bg-warm-200 mx-1 hidden sm:block"></span>
      <button data-filter="cat" data-v="all" class="active px-3.5 py-1.5 rounded-lg text-xs font-semibold bg-gray-800 text-white transition">Everyone</button>
      <button data-filter="cat" data-v="ps" class="px-3.5 py-1.5 rounded-lg text-xs font-semibold bg-warm-100 text-gray-400 hover:bg-slate-100 hover:text-slate-600 transition">VIP</button>
      <button data-filter="cat" data-v="f" class="px-3.5 py-1.5 rounded-lg text-xs font-semibold bg-warm-100 text-gray-400 hover:bg-amber-50 hover:text-amber-700 transition">Family</button>
      <button data-filter="cat" data-v="e" class="px-3.5 py-1.5 rounded-lg text-xs font-semibold bg-warm-100 text-gray-400 hover:bg-emerald-50 hover:text-emerald-600 transition">Entourage</button>
      <button data-filter="cat" data-v="g" class="px-3.5 py-1.5 rounded-lg text-xs font-semibold bg-warm-100 text-gray-400 hover:bg-slate-100 hover:text-slate-500 transition">Guests</button>
    </div>
  </div>

  <!-- ═══ TABLE ═══ -->
  <div class="bg-white rounded-2xl shadow-sm overflow-x-auto" id="tableWrap">
    <table class="w-full text-sm min-w-[600px]">
      <thead>
        <tr class="border-b border-warm-200 text-left">
          <th class="px-5 py-3.5 text-[10px] font-bold text-gray-400 uppercase tracking-widest">Guest</th>
          <th class="px-5 py-3.5 text-[10px] font-bold text-gray-400 uppercase tracking-widest hidden sm:table-cell">Category</th>
          <th class="px-5 py-3.5 text-[10px] font-bold text-gray-400 uppercase tracking-widest">Table</th>
          <th class="px-5 py-3.5 text-[10px] font-bold text-gray-400 uppercase tracking-widest">Status</th>
          <th class="px-5 py-3.5 text-[10px] font-bold text-gray-400 uppercase tracking-widest text-right">Action</th>
        </tr>
      </thead>
      <tbody id="tbody" class="divide-y divide-warm-100">
        <tr><td colspan="5" class="px-5 py-16 text-center text-gray-300">Loading...</td></tr>
      </tbody>
    </table>
  </div>

</main>

<!-- ═══ VIEWS FAB (top-left) ═══ -->
<button id="viewFab" class="fixed top-3 left-3 h-10 px-3 rounded-full bg-violet-500 text-white shadow-lg hover:bg-violet-600 active:scale-95 transition flex items-center gap-1.5 z-50" title="Guest Views">
  <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
  <span id="viewBadge" class="text-[11px] font-bold">0</span>
</button>

<!-- ═══ MESSAGES FAB (top-right) ═══ -->
<button id="msgFab" class="fixed top-3 right-3 h-10 px-3 rounded-full bg-wed-500 text-white shadow-lg hover:bg-wed-600 active:scale-95 transition flex items-center gap-1.5 z-50" title="Guest Messages">
  <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
  <span id="msgBadge" class="text-[11px] font-bold">0</span>
</button>

<!-- ═══ OVERLAY + DRAWERS ═══ -->
<div id="drawerOverlay" class="fixed inset-0 bg-black/30 z-40 opacity-0 pointer-events-none transition-opacity duration-300"></div>

<div id="viewDrawer" class="fixed top-0 left-0 h-full w-80 sm:w-96 bg-white shadow-2xl z-50 flex flex-col -translate-x-full transition-transform duration-300 ease-in-out">
  <div class="flex items-center justify-between px-5 py-4 border-b border-warm-200 bg-warm-50 shrink-0">
    <span class="text-xs font-bold text-gray-600 uppercase tracking-[2px]">Guest Views</span>
    <button id="viewClose" class="w-7 h-7 flex items-center justify-center rounded-full hover:bg-warm-200 text-gray-400 text-lg transition">&times;</button>
  </div>
  <div id="viewList" class="overflow-y-auto flex-1"></div>
</div>

<div id="viewDetail" class="fixed top-0 left-0 h-full w-80 sm:w-96 bg-white shadow-2xl z-50 flex flex-col -translate-x-full transition-transform duration-300 ease-in-out">
  <div class="flex items-center gap-3 px-5 py-4 border-b border-warm-200 bg-warm-50 shrink-0">
    <button id="viewDetailBack" class="w-7 h-7 flex items-center justify-center rounded-full hover:bg-warm-200 text-gray-400 transition">
      <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><polyline points="15 18 9 12 15 6"/></svg>
    </button>
    <span id="viewDetailName" class="text-xs font-bold text-gray-600 uppercase tracking-[1px]"></span>
  </div>
  <div id="viewDetailList" class="overflow-y-auto flex-1"></div>
</div>

<div id="msgDrawer" class="fixed top-0 right-0 h-full w-80 sm:w-96 bg-white shadow-2xl z-50 flex flex-col translate-x-full transition-transform duration-300 ease-in-out">
  <div class="flex items-center justify-between px-5 py-4 border-b border-warm-200 bg-warm-50 shrink-0">
    <span class="text-xs font-bold text-gray-600 uppercase tracking-[2px]">Guest Messages</span>
    <button id="msgClose" class="w-7 h-7 flex items-center justify-center rounded-full hover:bg-warm-200 text-gray-400 text-lg transition">&times;</button>
  </div>
  <div id="msgList" class="overflow-y-auto flex-1"></div>
</div>

<script>
try{screen.orientation.lock('landscape').catch(function(){});}catch(e){}
var sb=supabase.createClient('https://twcynoszygedohyoqftu.supabase.co','sb_publishable_FAwCKHnzhIFI2_at0KubEw_msQfc6yF');
var guests=[],sFilter='all',cFilter='all',query='';
var catLabel={ps:'VIP / Sponsor',e:'Entourage',f:'Family',g:'Guest'};
var catOrder={ps:0,f:1,e:2,g:3};
var statusColors={
  confirmed:'bg-emerald-50 text-emerald-600',
  declined:'bg-red-50 text-red-500',
  pending:'bg-amber-50 text-amber-600',
  checkedin:'bg-blue-50 text-blue-600'
};
var statusActive={
  all:'bg-gray-800 text-white',
  confirmed:'bg-emerald-600 text-white',
  declined:'bg-red-500 text-white',
  pending:'bg-amber-500 text-white',
  checkedin:'bg-blue-600 text-white'
};
var catActive={
  all:'bg-gray-800 text-white',
  ps:'bg-slate-600 text-white',
  f:'bg-amber-700 text-white',
  e:'bg-emerald-600 text-white',
  g:'bg-slate-500 text-white'
};
var avatarBg={ps:'bg-slate-600',e:'bg-emerald-600',f:'bg-amber-800',g:'bg-gray-400'};

// ─── Offline sync ───
var CACHE_KEY='wed_guests';
var QUEUE_KEY='wed_checkin_queue';

function getQueue(){try{return JSON.parse(localStorage.getItem(QUEUE_KEY))||[];}catch(e){return[];}}
function saveQueue(q){try{localStorage.setItem(QUEUE_KEY,JSON.stringify(q));}catch(e){}}
function cacheGuests(){try{localStorage.setItem(CACHE_KEY,JSON.stringify(guests));}catch(e){}}
function getCachedGuests(){try{return JSON.parse(localStorage.getItem(CACHE_KEY))||[];}catch(e){return[];}}

function setSyncStatus(state){
  var dot=document.getElementById('syncDot');
  var label=document.getElementById('syncLabel');
  if(state==='synced'){dot.className='w-2 h-2 rounded-full bg-emerald-400';label.textContent='Synced';}
  else if(state==='pending'){dot.className='w-2 h-2 rounded-full bg-amber-400 animate-pulse';label.textContent=getQueue().length+' pending';}
  else{dot.className='w-2 h-2 rounded-full bg-red-400';label.textContent='Offline';}
}

async function flushQueue(){
  var q=getQueue();
  if(!q.length)return;
  var remaining=[];
  for(var i=0;i<q.length;i++){
    var r=await sb.from('checkins').insert({guest_id:q[i].guest_id,checked_in_by:'dashboard'}).select().single();
    if(r.error)remaining.push(q[i]);
  }
  saveQueue(remaining);
  setSyncStatus(remaining.length?'pending':'synced');
  if(!remaining.length)load();
}

async function load(){
  try{
    var g=await sb.from('guests').select('*');
    if(g.error)throw g.error;
    var r=await sb.from('rsvps').select('guest_id,attending,message,submitted_at');
    var c=await sb.from('checkins').select('guest_id,checked_in_at');
    var v=await sb.from('views').select('guest_id,viewed_at');
    var rm={};(r.data||[]).forEach(function(x){
      if(!rm[x.guest_id]||x.submitted_at>rm[x.guest_id].submitted_at)rm[x.guest_id]=x;
    });
    var cm={};(c.data||[]).forEach(function(x){cm[x.guest_id]=x;});
    allViewsData=v.data||[];
    var vm={};var vc={};(v.data||[]).forEach(function(x){
      vc[x.guest_id]=(vc[x.guest_id]||0)+1;
      if(!vm[x.guest_id]||x.viewed_at>vm[x.guest_id].viewed_at)vm[x.guest_id]=x;
    });
    var localQueue=getQueue();
    var queueIds={};localQueue.forEach(function(x){queueIds[x.guest_id]=true;});
    guests=(g.data||[]).map(function(g){
      var rv=rm[g.id]||null,ci=cm[g.id]||null;
      var st=ci||queueIds[g.id]?'checkedin':rv?(rv.attending?'confirmed':'declined'):'pending';
      return{id:g.id,gid:g.guest_id,name:g.full_name,display:g.display_name,cat:g.category,
        table:g.table_number,status:st,msg:rv?rv.message:null,msgAt:rv?rv.submitted_at:null,
        viewed:!!vm[g.id],viewCount:vc[g.id]||0,lastView:vm[g.id]?vm[g.id].viewed_at:null};
    });
    sortGuests();
    cacheGuests();
    setSyncStatus(localQueue.length?'pending':'synced');
    if(localQueue.length)flushQueue();
  }catch(e){
    guests=getCachedGuests();
    if(!guests.length){document.getElementById('tbody').innerHTML='<tr><td colspan="5" class="px-5 py-16 text-center text-red-400">Offline — no cached data</td></tr>';setSyncStatus('offline');return;}
    setSyncStatus(getQueue().length?'pending':'offline');
  }
  stats();render();updateBadges();
}

function sortGuests(){
  guests.sort(function(a,b){
    var co=catOrder[a.cat]-catOrder[b.cat];
    return co!==0?co:a.name.localeCompare(b.name);
  });
}

function stats(){
  var co=guests.filter(function(g){return g.status==='confirmed'||g.status==='checkedin'}).length;
  document.getElementById('sT').textContent=guests.length;
  document.getElementById('sC').textContent=co;
  document.getElementById('sD').textContent=guests.filter(function(g){return g.status==='declined'}).length;
  document.getElementById('sP').textContent=guests.filter(function(g){return g.status==='pending'}).length;
  document.getElementById('sV').textContent=guests.filter(function(g){return g.viewed}).length;
}

function render(){
  var tb=document.getElementById('tbody');
  var f=guests.filter(function(g){
    if(sFilter!=='all'&&g.status!==sFilter)return false;
    if(cFilter!=='all'&&g.cat!==cFilter)return false;
    if(query&&g.name.toLowerCase().indexOf(query)===-1)return false;
    return true;
  });
  if(!f.length){tb.innerHTML='<tr><td colspan="5" class="px-5 py-16 text-center text-gray-300">No guests found</td></tr>';return;}

  var lastCat='';
  tb.innerHTML=f.map(function(g){
    var ini=g.name.split(' ').map(function(w){return w[0]}).join('').substring(0,2).toUpperCase();
    var labels={confirmed:'Going',declined:'Declined',pending:'Pending',checkedin:'Checked In'};
    var sc=statusColors[g.status];
    var btn='';
    if(g.status==='confirmed')btn='<button class="ci inline-flex items-center gap-1.5 px-3 py-1.5 rounded-lg bg-emerald-600 text-white text-xs font-semibold hover:bg-emerald-700 active:scale-95 transition" data-id="'+g.id+'">&#10003; Check In</button>';
    else if(g.status==='checkedin')btn='<span class="inline-flex items-center gap-1 px-3 py-1.5 rounded-lg bg-blue-50 text-blue-500 text-xs font-semibold">&#10003; Done</span>';
    else btn='<span class="text-gray-300">—</span>';
    var copyBtn='<button class="cplink ml-1.5 inline-flex items-center gap-1 px-2 py-1.5 rounded-lg bg-warm-100 text-gray-400 text-[10px] font-semibold hover:bg-wed-50 hover:text-wed-500 active:scale-95 transition" data-gid="'+g.gid+'" title="Copy invitation link">&#128279;</button>';

    var secRow='';
    if(g.cat!==lastCat){
      lastCat=g.cat;
      var secNames={ps:'VIP / Principal Sponsors',f:'Immediate Family',e:'Entourage',g:'Guests'};
      var count=f.filter(function(x){return x.cat===g.cat}).length;
      secRow='<tr><td colspan="5" class="px-5 pt-6 pb-2 text-[10px] font-bold text-gray-400 uppercase tracking-[2px] bg-warm-50">'+secNames[g.cat]+' &middot; '+count+'</td></tr>';
    }

    var viewedBadge=g.viewed?'<span class="ml-1.5 text-[9px] text-emerald-500" title="Opened invitation">&#128065;</span>':'';

    return secRow+'<tr class="hover:bg-warm-50/50 transition-colors">'+
      '<td class="px-5 py-3"><div class="flex items-center gap-3">'+
        '<div class="w-8 h-8 rounded-lg '+avatarBg[g.cat]+' flex items-center justify-center text-white text-[11px] font-bold shrink-0">'+ini+'</div>'+
        '<span class="font-medium">'+esc(g.name)+viewedBadge+'</span></div></td>'+
      '<td class="px-5 py-3 text-gray-400 text-xs hidden sm:table-cell">'+catLabel[g.cat]+'</td>'+
      '<td class="px-5 py-3 text-gray-500 text-xs">'+(g.table?'Table '+g.table:'—')+'</td>'+
      '<td class="px-5 py-3"><span class="inline-block px-2.5 py-1 rounded-md text-[10px] font-bold uppercase tracking-wide '+sc+'">'+labels[g.status]+'</span></td>'+
      '<td class="px-5 py-3 text-right whitespace-nowrap">'+btn+copyBtn+'</td></tr>';
  }).join('');

  tb.querySelectorAll('.ci').forEach(function(b){
    b.addEventListener('click',function(){checkin(this.dataset.id,this)});
  });
  tb.querySelectorAll('.cplink').forEach(function(b){
    b.addEventListener('click',function(){
      var link='https://gzdev.app/theweddingofangelicaandjordan/invitation/'+this.dataset.gid;
      navigator.clipboard.writeText(link).then(function(){
        b.innerHTML='&#10003;';b.classList.add('bg-emerald-50','text-emerald-600');
        b.classList.remove('bg-warm-100','text-gray-400');
        setTimeout(function(){b.innerHTML='&#128279;';b.classList.remove('bg-emerald-50','text-emerald-600');b.classList.add('bg-warm-100','text-gray-400');},1500);
      });
    });
  });
}

async function checkin(id,b){
  b.disabled=true;b.textContent='...';
  var g=guests.find(function(x){return x.id===id});
  try{
    var r=await sb.from('checkins').insert({guest_id:id,checked_in_by:'dashboard'}).select().single();
    if(r.error)throw r.error;
  }catch(e){
    var q=getQueue();
    q.push({guest_id:id,ts:Date.now()});
    saveQueue(q);
    setSyncStatus('pending');
  }
  if(g)g.status='checkedin';
  cacheGuests();
  stats();render();
}

function esc(s){var d=document.createElement('div');d.textContent=s;return d.innerHTML;}

window.addEventListener('online',function(){setSyncStatus('synced');flushQueue();});
window.addEventListener('offline',function(){setSyncStatus('offline');});

document.getElementById('q').addEventListener('input',function(){query=this.value.toLowerCase().trim();render();});

document.querySelectorAll('[data-filter="status"]').forEach(function(b){
  b.addEventListener('click',function(){
    var v=this.dataset.v;
    document.querySelectorAll('[data-filter="status"]').forEach(function(x){
      x.className='px-3.5 py-1.5 rounded-lg text-xs font-semibold bg-warm-100 text-gray-400 transition';
    });
    this.className='px-3.5 py-1.5 rounded-lg text-xs font-semibold transition active '+(statusActive[v]||'');
    sFilter=v;render();
  });
});
document.querySelectorAll('[data-filter="cat"]').forEach(function(b){
  b.addEventListener('click',function(){
    var v=this.dataset.v;
    document.querySelectorAll('[data-filter="cat"]').forEach(function(x){
      x.className='px-3.5 py-1.5 rounded-lg text-xs font-semibold bg-warm-100 text-gray-400 transition';
    });
    this.className='px-3.5 py-1.5 rounded-lg text-xs font-semibold transition active '+(catActive[v]||'');
    cFilter=v;render();
  });
});

load();

if('serviceWorker' in navigator){
  navigator.serviceWorker.register('sw.js');
}

function timeAgo(ts){
  if(!ts)return '';
  var d=Math.floor((Date.now()-new Date(ts).getTime())/1000);
  if(d<60)return 'just now';
  if(d<3600)return Math.floor(d/60)+'m ago';
  if(d<86400)return Math.floor(d/3600)+'h ago';
  return Math.floor(d/86400)+'d ago';
}

function updateBadges(){
  document.getElementById('msgBadge').textContent=guests.filter(function(g){return g.msg}).length;
  document.getElementById('viewBadge').textContent=guests.filter(function(g){return g.viewed}).length;
}

function renderMessages(){
  var list=document.getElementById('msgList');
  var msgs=guests.filter(function(g){return g.msg}).sort(function(a,b){
    return (b.msgAt||'').localeCompare(a.msgAt||'');
  });
  updateBadges();
  if(!msgs.length){list.innerHTML='<p class="text-center text-gray-300 py-10">No messages yet</p>';return;}
  list.innerHTML=msgs.map(function(g){
    return '<div class="px-5 py-4 border-b border-warm-100">'+
      '<div class="flex items-center justify-between mb-1.5">'+
        '<div class="flex items-center gap-2.5">'+
          '<div class="w-7 h-7 rounded-lg '+avatarBg[g.cat]+' flex items-center justify-center text-white text-[10px] font-bold shrink-0">'+g.name.split(' ').map(function(w){return w[0]}).join('').substring(0,2).toUpperCase()+'</div>'+
          '<span class="font-semibold text-sm text-gray-700">'+esc(g.name)+'</span>'+
        '</div>'+
        '<span class="text-[10px] text-gray-300">'+timeAgo(g.msgAt)+'</span>'+
      '</div>'+
      '<p class="text-sm text-gray-500 italic pl-9">&ldquo;'+esc(g.msg)+'&rdquo;</p>'+
    '</div>';
  }).join('');
}

var allViewsData=[];

function renderViews(){
  var list=document.getElementById('viewList');
  var views=guests.filter(function(g){return g.viewed}).sort(function(a,b){
    return (b.lastView||'').localeCompare(a.lastView||'');
  });
  updateBadges();
  if(!views.length){list.innerHTML='<p class="text-center text-gray-300 py-10">No views yet</p>';return;}
  list.innerHTML=views.map(function(g){
    return '<div class="px-5 py-3.5 border-b border-warm-100 flex items-center justify-between cursor-pointer hover:bg-warm-50 transition" data-viewid="'+g.id+'">'+
      '<div class="flex items-center gap-2.5">'+
        '<div class="w-7 h-7 rounded-lg '+avatarBg[g.cat]+' flex items-center justify-center text-white text-[10px] font-bold shrink-0">'+g.name.split(' ').map(function(w){return w[0]}).join('').substring(0,2).toUpperCase()+'</div>'+
        '<div>'+
          '<div class="font-semibold text-sm text-gray-700">'+esc(g.name)+'</div>'+
          '<div class="text-[10px] text-gray-300">'+timeAgo(g.lastView)+'</div>'+
        '</div>'+
      '</div>'+
      '<div class="flex items-center gap-2">'+
        '<span class="inline-flex items-center gap-1 px-2 py-0.5 rounded-full bg-violet-50 text-violet-500 text-[11px] font-bold">'+g.viewCount+'&times;</span>'+
        '<svg class="text-gray-300" xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><polyline points="9 18 15 12 9 6"/></svg>'+
      '</div>'+
    '</div>';
  }).join('');
  list.querySelectorAll('[data-viewid]').forEach(function(el){
    el.addEventListener('click',function(){showViewDetail(this.dataset.viewid);});
  });
}

function formatDate(ts){
  var d=new Date(ts);
  var months=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  var h=d.getHours(),m=d.getMinutes(),ampm=h>=12?'PM':'AM';
  h=h%12||12;
  return months[d.getMonth()]+' '+d.getDate()+', '+d.getFullYear()+' — '+h+':'+(m<10?'0':'')+m+' '+ampm;
}

function showViewDetail(guestUuid){
  var g=guests.find(function(x){return x.id===guestUuid});
  if(!g)return;
  var guestViews=allViewsData.filter(function(v){return v.guest_id===guestUuid}).sort(function(a,b){
    return (b.viewed_at||'').localeCompare(a.viewed_at||'');
  });
  var detail=document.getElementById('viewDetail');
  var detailTitle=document.getElementById('viewDetailName');
  var detailList=document.getElementById('viewDetailList');
  detailTitle.textContent=g.name+' ('+guestViews.length+' views)';
  detailList.innerHTML=guestViews.map(function(v,i){
    return '<div class="px-5 py-3 border-b border-warm-100 flex items-center gap-3">'+
      '<span class="w-6 h-6 rounded-full bg-violet-50 text-violet-500 text-[10px] font-bold flex items-center justify-center shrink-0">'+(i+1)+'</span>'+
      '<span class="text-sm text-gray-600">'+formatDate(v.viewed_at)+'</span>'+
    '</div>';
  }).join('');
  document.getElementById('viewDrawer').classList.add('-translate-x-full');
  setTimeout(function(){detail.classList.remove('-translate-x-full');},150);
}

document.getElementById('viewDetailBack').addEventListener('click',function(){
  document.getElementById('viewDetail').classList.add('-translate-x-full');
  setTimeout(function(){document.getElementById('viewDrawer').classList.remove('-translate-x-full');},150);
});

function openOverlay(){
  var ov=document.getElementById('drawerOverlay');
  ov.classList.remove('opacity-0','pointer-events-none');
  ov.classList.add('opacity-100');
}
function closeAll(){
  document.getElementById('msgDrawer').classList.add('translate-x-full');
  document.getElementById('viewDrawer').classList.add('-translate-x-full');
  document.getElementById('viewDetail').classList.add('-translate-x-full');
  var ov=document.getElementById('drawerOverlay');
  ov.classList.add('opacity-0','pointer-events-none');
  ov.classList.remove('opacity-100');
}

document.getElementById('msgFab').addEventListener('click',function(){renderMessages();document.getElementById('msgDrawer').classList.remove('translate-x-full');openOverlay();});
document.getElementById('viewFab').addEventListener('click',function(){renderViews();document.getElementById('viewDrawer').classList.remove('-translate-x-full');openOverlay();});
document.getElementById('msgClose').addEventListener('click',closeAll);
document.getElementById('viewClose').addEventListener('click',closeAll);
document.getElementById('drawerOverlay').addEventListener('click',closeAll);
</script>

</body>
</html>
