<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>A &amp; J Monogram</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      background: #0a1f14;
    }

    /* === EMERALD BACKGROUND === */
    .bg {
      position: fixed;
      inset: 0;
      z-index: 0;
      /* Rich emerald gradient with depth */
      background:
        radial-gradient(ellipse at 50% 50%, rgba(30,70,45,0.6) 0%, transparent 60%),
        radial-gradient(ellipse at 20% 20%, rgba(15,50,30,0.4) 0%, transparent 50%),
        radial-gradient(ellipse at 80% 80%, rgba(15,50,30,0.4) 0%, transparent 50%),
        radial-gradient(ellipse at 50% 50%, #0d2818 0%, #071a0f 40%, #040e08 100%);
    }

    /* Subtle texture overlay */
    .bg::before {
      content: '';
      position: absolute;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.03'/%3E%3C/svg%3E");
      opacity: 0.5;
      mix-blend-mode: overlay;
    }

    /* Center glow behind monogram */
    .bg::after {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      width: 500px;
      height: 500px;
      transform: translate(-50%, -50%);
      background: radial-gradient(circle, rgba(201,169,110,0.06) 0%, rgba(30,70,45,0.1) 40%, transparent 70%);
      border-radius: 50%;
    }

    /* === SPARKLES / STARS === */
    .sparkles {
      position: fixed;
      inset: 0;
      z-index: 1;
      pointer-events: none;
    }

    .sparkle {
      position: absolute;
      width: 4px;
      height: 4px;
      background: radial-gradient(circle, rgba(255,255,255,0.9) 0%, transparent 70%);
      border-radius: 50%;
      animation: twinkle var(--duration) ease-in-out var(--delay) infinite;
    }

    /* 4-pointed star sparkles */
    .star {
      position: absolute;
      width: 0;
      height: 0;
      animation: twinkle var(--duration) ease-in-out var(--delay) infinite;
    }
    .star::before, .star::after {
      content: '';
      position: absolute;
      background: rgba(255,255,255,0.8);
    }
    .star::before {
      width: var(--size);
      height: 1px;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
    }
    .star::after {
      width: 1px;
      height: var(--size);
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
    }

    /* Gold bokeh particles */
    .gold-particle {
      position: absolute;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(201,169,110,0.6) 0%, rgba(201,169,110,0) 70%);
      animation: floatUp var(--duration) ease-in-out var(--delay) infinite;
    }

    @keyframes twinkle {
      0%, 100% { opacity: 0; transform: scale(0.5); }
      50% { opacity: 1; transform: scale(1); }
    }

    @keyframes floatUp {
      0% { opacity: 0; transform: translateY(10px) scale(0.8); }
      30% { opacity: 0.8; }
      70% { opacity: 0.6; }
      100% { opacity: 0; transform: translateY(-30px) scale(1.1); }
    }

    /* === DECORATIVE CORNER LEAVES === */
    .corner-leaves {
      position: fixed;
      inset: 0;
      z-index: 2;
      pointer-events: none;
      overflow: hidden;
    }

    .leaf-cluster {
      position: absolute;
    }

    .leaf-cluster svg {
      width: 100%;
      height: 100%;
    }

    .leaf-cluster.top-left {
      top: -30px;
      left: -30px;
      width: 280px;
      height: 280px;
      transform: rotate(0deg);
    }
    .leaf-cluster.top-right {
      top: -30px;
      right: -30px;
      width: 250px;
      height: 250px;
      transform: scaleX(-1);
    }
    .leaf-cluster.bottom-left {
      bottom: -30px;
      left: -30px;
      width: 240px;
      height: 240px;
      transform: scaleY(-1);
    }
    .leaf-cluster.bottom-right {
      bottom: -30px;
      right: -30px;
      width: 270px;
      height: 270px;
      transform: scale(-1, -1);
    }

    /* === MONOGRAM CONTAINER === */
    .monogram-wrap {
      position: relative;
      z-index: 5;
      width: 500px;
      height: 500px;
    }
    .monogram-wrap svg { width: 100%; height: 100%; overflow: visible; }

    /* Handwriting animation */
    .letter-path {
      fill: none;
      stroke: #C9A96E;
      stroke-width: 3;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .letter-fill {
      opacity: 0;
      transition: opacity 0.8s ease;
    }
    .letter-fill.visible { opacity: 1; }
    .wreath-path {
      fill: none;
      stroke: #4A6B4A;
      stroke-width: 1.5;
      stroke-linecap: round;
    }
    .wreath-leaf {
      fill: #4A6B4A;
      opacity: 0;
      transition: opacity 0.3s ease;
    }
    .wreath-leaf.visible { opacity: 0.85; }
    .wreath-bud {
      fill: #6B8F6B;
      opacity: 0;
      transition: opacity 0.3s ease;
    }
    .wreath-bud.visible { opacity: 0.7; }

    .replay-btn {
      position: fixed;
      bottom: 30px;
      right: 30px;
      z-index: 10;
      background: rgba(201,169,110,0.15);
      border: 1px solid rgba(201,169,110,0.4);
      color: #C9A96E;
      padding: 10px 20px;
      font-family: 'Georgia', serif;
      font-size: 14px;
      cursor: pointer;
      border-radius: 4px;
      transition: all 0.3s;
    }
    .replay-btn:hover { background: rgba(201,169,110,0.3); }
  </style>
</head>

  <script>
    // === GENERATE SPARKLES & PARTICLES ===
    function createSparkles() {
      const container = document.getElementById('sparkles');
      container.innerHTML = '';
      const w = window.innerWidth;
      const h = window.innerHeight;

      // Small dot sparkles
      for (let i = 0; i < 50; i++) {
        const s = document.createElement('div');
        s.className = 'sparkle';
        s.style.left = Math.random() * w + 'px';
        s.style.top = Math.random() * h + 'px';
        const size = 1 + Math.random() * 3;
        s.style.width = size + 'px';
        s.style.height = size + 'px';
        s.style.setProperty('--duration', (3 + Math.random() * 5) + 's');
        s.style.setProperty('--delay', (Math.random() * 5) + 's');
        container.appendChild(s);
      }

      // 4-pointed star sparkles
      for (let i = 0; i < 15; i++) {
        const s = document.createElement('div');
        s.className = 'star';
        s.style.left = Math.random() * w + 'px';
        s.style.top = Math.random() * h + 'px';
        s.style.setProperty('--size', (8 + Math.random() * 16) + 'px');
        s.style.setProperty('--duration', (4 + Math.random() * 6) + 's');
        s.style.setProperty('--delay', (Math.random() * 6) + 's');
        container.appendChild(s);
      }

      // Gold bokeh particles
      for (let i = 0; i < 25; i++) {
        const p = document.createElement('div');
        p.className = 'gold-particle';
        p.style.left = Math.random() * w + 'px';
        p.style.top = (Math.random() * h * 0.8 + h * 0.1) + 'px';
        const size = 3 + Math.random() * 8;
        p.style.width = size + 'px';
        p.style.height = size + 'px';
        p.style.setProperty('--duration', (5 + Math.random() * 8) + 's');
        p.style.setProperty('--delay', (Math.random() * 8) + 's');
        container.appendChild(p);
      }
    }

    createSparkles();
    window.addEventListener('resize', createSparkles);

    // === HANDWRITING ANIMATION ===
    function animatePath(pathEl, duration, delay) {
      const length = pathEl.getTotalLength();
      pathEl.style.strokeDasharray = length;
      pathEl.style.strokeDashoffset = length;
      pathEl.style.transition = 'none';
      pathEl.getBoundingClientRect();
      pathEl.style.transition = `stroke-dashoffset ${duration}s cubic-bezier(0.4, 0, 0.2, 1) ${delay}s`;
      pathEl.style.strokeDashoffset = '0';
    }

    function runAnimation() {
      const allPaths = document.querySelectorAll('.letter-path, .wreath-path');
      allPaths.forEach(p => {
        const len = p.getTotalLength();
        p.style.transition = 'none';
        p.style.strokeDasharray = len;
        p.style.strokeDashoffset = len;
      });
      document.querySelectorAll('.letter-fill').forEach(el => el.classList.remove('visible'));
      document.querySelectorAll('.wreath-leaf').forEach(el => el.classList.remove('visible'));
      document.querySelectorAll('.wreath-bud').forEach(el => el.classList.remove('visible'));
      document.body.getBoundingClientRect();

      animatePath(document.getElementById('wreath-left'), 1.5, 0);
      animatePath(document.getElementById('wreath-right'), 1.5, 0.1);
      animatePath(document.getElementById('wreath-left-inner'), 1.5, 0.2);
      animatePath(document.getElementById('wreath-right-inner'), 1.5, 0.3);

      const leaves = document.querySelectorAll('.wreath-leaf');
      leaves.forEach((leaf, i) => setTimeout(() => leaf.classList.add('visible'), 1000 + i * 40));
      const buds = document.querySelectorAll('.wreath-bud');
      buds.forEach((bud, i) => setTimeout(() => bud.classList.add('visible'), 1500 + i * 50));

      animatePath(document.getElementById('pathA1'), 1.2, 2.0);
      animatePath(document.getElementById('pathA2'), 0.5, 3.0);
      animatePath(document.getElementById('pathA3'), 1.0, 3.3);
      animatePath(document.getElementById('pathJ1'), 0.3, 4.2);
      animatePath(document.getElementById('pathJ2'), 1.3, 4.4);
      animatePath(document.getElementById('pathJ3'), 0.8, 5.5);

      setTimeout(() => {
        document.getElementById('letterA').style.opacity = '0';
        document.getElementById('letterA-fill').classList.add('visible');
      }, 4500);
      setTimeout(() => {
        document.getElementById('letterJ').style.opacity = '0';
        document.getElementById('letterJ-fill').classList.add('visible');
      }, 6500);
    }

    function replayAnimation() {
      document.getElementById('letterA').style.opacity = '1';
      document.getElementById('letterJ').style.opacity = '1';
      runAnimation();
    }

    window.addEventListener('load', () => setTimeout(runAnimation, 300));
  </script>
</body>
</html>
