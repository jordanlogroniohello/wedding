<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>A &amp; J</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=Italianno&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#081a10}

/* ── Background ── */
.background{
  position:fixed;inset:0;z-index:0;
  background:
    radial-gradient(ellipse 65% 60% at 50% 50%,#1a3a2a 0%,#13301f 35%,#0d2818 60%,#081a10 85%,#051208 100%);
  opacity:0;
  animation:bgIn 2.2s ease forwards;
}

/* ── Ambient warm glow behind monogram ── */
.mono-ambient{
  position:fixed;z-index:1;
  top:38%;left:50%;
  transform:translate(-50%,-50%);
  width:55vw;height:55vh;
  background:
    radial-gradient(ellipse 45% 40% at 50% 50%,rgba(220,195,130,.14) 0%,rgba(190,165,100,.08) 25%,rgba(160,140,80,.03) 45%,transparent 65%);
  pointer-events:none;
  opacity:0;
  animation:bgIn 3s ease 1s forwards;
}

/* ── Warm atmospheric haze ── */
.atmos-haze{
  position:fixed;inset:0;z-index:1;
  pointer-events:none;
  background:
    linear-gradient(180deg,rgba(200,175,110,.09) 0%,rgba(180,155,90,.04) 25%,transparent 50%),
    radial-gradient(ellipse 80% 40% at 30% 15%,rgba(210,185,120,.06) 0%,transparent 60%),
    radial-gradient(ellipse 80% 40% at 75% 10%,rgba(210,185,120,.05) 0%,transparent 55%),
    radial-gradient(ellipse 50% 50% at 50% 85%,rgba(190,165,100,.04) 0%,transparent 50%);
  opacity:0;
  animation:bgIn 3s ease .5s forwards;
}

/* ── Vignette ── */
.vignette{
  position:fixed;inset:0;z-index:2;
  pointer-events:none;
  background:radial-gradient(ellipse 72% 68% at 50% 50%,transparent 35%,rgba(5,12,8,.55) 100%);
}

/* ── Back particles canvas (behind florals & monogram) ── */
canvas.particles-back{
  position:fixed;inset:0;z-index:3;
  pointer-events:none;
}

/* ── Florals ── */
.floral-top-left,
.floral-bottom-right{
  position:fixed;z-index:4;
  pointer-events:none;
  opacity:0;
}
.floral-top-left img,
.floral-bottom-right img{
  display:block;width:100%;height:auto;
}

.floral-top-left{
  top:-5%;left:-4%;
  width:clamp(180px,28vw,460px);
  filter:drop-shadow(0 0 25px rgba(226,194,117,.2));
  animation:floralTL 2.4s ease .5s forwards;
}
.floral-bottom-right{
  bottom:-5%;right:-4%;
  width:clamp(180px,28vw,460px);
  transform:rotate(180deg) scale(.95);
  filter:drop-shadow(0 0 25px rgba(226,194,117,.2));
  animation:floralBR 2.4s ease .9s forwards;
}

/* ── Monogram ── */
.monogram{
  position:fixed;z-index:5;
  top:38%;left:50%;
  transform:translate(-50%,-50%) scale(.94);
  width:clamp(320px,42vw,680px);
  opacity:0;
  filter:
    drop-shadow(0 0 5px rgba(240,220,170,.35))
    drop-shadow(0 0 16px rgba(232,207,160,.28))
    drop-shadow(0 0 40px rgba(220,190,130,.2))
    drop-shadow(0 0 75px rgba(200,170,100,.1));
  animation:monoReveal 2.2s ease 1.6s forwards;
}
.monogram img{
  display:block;width:100%;height:auto;
  filter:brightness(1.12);
}

/* ── Typography ── */
.typography{
  position:fixed;z-index:6;
  left:50%;top:62%;
  transform:translateX(-50%);
  display:flex;flex-direction:column;align-items:center;
  gap:clamp(5px,1vh,12px);
  pointer-events:none;
}

.names{
  font-family:'Cormorant Garamond',Georgia,serif;
  font-style:italic;
  color:#E8CFA0;
  font-size:clamp(24px,3.5vw,42px);
  font-weight:400;
  letter-spacing:clamp(1.5px,.35vw,4px);
  white-space:nowrap;
  opacity:0;
  animation:textFadeUp 1.4s ease 4s forwards;
}

.hashtag{
  font-family:'Cormorant Garamond',Georgia,serif;
  color:rgba(232,207,160,.78);
  font-size:clamp(14px,2vw,22px);
  font-weight:500;
  letter-spacing:clamp(1px,.25vw,2.5px);
  opacity:0;
  animation:textFadeUp 1.2s ease 4.8s forwards;
}

.date{
  font-family:'Cormorant Garamond',Georgia,serif;
  font-style:normal;
  color:#E8CFA0;
  font-size:clamp(15px,2.2vw,24px);
  font-weight:600;
  letter-spacing:.5px;
  word-spacing:clamp(6px,1.2vw,14px);
  opacity:0;
  animation:textFadeUp 1.2s ease 5.5s forwards;
}

/* ── Front particles canvas (foreground bokeh, in front of everything) ── */
canvas.particles-front{
  position:fixed;inset:0;z-index:7;
  pointer-events:none;
}

/* ── Keyframes ── */
@keyframes bgIn{
  to{opacity:1}
}

@keyframes floralTL{
  0%{opacity:0;filter:drop-shadow(0 0 25px rgba(226,194,117,0)) blur(5px);transform:scale(.9)}
  100%{opacity:.82;filter:drop-shadow(0 0 25px rgba(226,194,117,.2)) blur(0);transform:scale(1)}
}

@keyframes floralBR{
  0%{opacity:0;filter:drop-shadow(0 0 25px rgba(226,194,117,0)) blur(5px);transform:rotate(180deg) scale(.88)}
  100%{opacity:.82;filter:drop-shadow(0 0 25px rgba(226,194,117,.2)) blur(0);transform:rotate(180deg) scale(.95)}
}

@keyframes monoReveal{
  0%{opacity:0;transform:translate(-50%,-50%) scale(.93);filter:
    drop-shadow(0 0 5px rgba(240,220,170,0))
    drop-shadow(0 0 14px rgba(232,207,160,0))
    drop-shadow(0 0 35px rgba(220,190,130,0))
    drop-shadow(0 0 65px rgba(200,170,100,0))}
  40%{opacity:.8;filter:
    drop-shadow(0 0 5px rgba(240,220,170,.32))
    drop-shadow(0 0 14px rgba(232,207,160,.25))
    drop-shadow(0 0 35px rgba(220,190,130,.18))
    drop-shadow(0 0 65px rgba(200,170,100,.08))}
  65%{opacity:1;transform:translate(-50%,-50%) scale(1.012);filter:
    drop-shadow(0 0 6px rgba(240,220,170,.4))
    drop-shadow(0 0 18px rgba(232,207,160,.32))
    drop-shadow(0 0 45px rgba(220,190,130,.22))
    drop-shadow(0 0 75px rgba(200,170,100,.12))}
  100%{opacity:1;transform:translate(-50%,-50%) scale(1);filter:
    drop-shadow(0 0 5px rgba(240,220,170,.32))
    drop-shadow(0 0 14px rgba(232,207,160,.25))
    drop-shadow(0 0 35px rgba(220,190,130,.18))
    drop-shadow(0 0 65px rgba(200,170,100,.08))}
}

@keyframes monoGlow{
  0%,100%{filter:
    drop-shadow(0 0 5px rgba(240,220,170,.32))
    drop-shadow(0 0 14px rgba(232,207,160,.25))
    drop-shadow(0 0 35px rgba(220,190,130,.18))
    drop-shadow(0 0 65px rgba(200,170,100,.08))}
  50%{filter:
    drop-shadow(0 0 6px rgba(240,220,170,.42))
    drop-shadow(0 0 18px rgba(232,207,160,.35))
    drop-shadow(0 0 45px rgba(220,190,130,.25))
    drop-shadow(0 0 80px rgba(200,170,100,.14))}
}

@keyframes textFadeUp{
  0%{opacity:0;transform:translateY(8px)}
  100%{opacity:1;transform:translateY(0)}
}

@media(prefers-reduced-motion:reduce){
  .names,.hashtag,.date{animation:none;opacity:1}
  .monogram{animation:none;opacity:1;transform:translate(-50%,-50%) scale(1)}
  .floral-top-left,.floral-bottom-right{animation:none;opacity:.82}
  .background,.mono-ambient{animation:none;opacity:1}
}
</style>
</head>
<body>

<div class="background"></div>
<div class="mono-ambient"></div>
<div class="atmos-haze"></div>
<div class="vignette"></div>

<canvas class="particles-back" id="pBack"></canvas>

<div class="floral-top-left">
  <img src="floral-top-left.png" alt="">
</div>
<div class="floral-bottom-right">
  <img src="floral-top-left.png" alt="">
</div>

<div class="monogram">
  <img src="theweddingofangelicaandjordan/monogram.png" alt="A &amp; J">
</div>

<div class="typography">
  <div class="names">Angelica &amp; Jordan</div>
  <div class="hashtag">#exchANGEofVowsWithDAN</div>
  <div class="date">11 &middot; 27 &middot; 26</div>
</div>

<canvas class="particles-front" id="pFront"></canvas>

<script>
const cBack  = document.getElementById('pBack');
const cFront = document.getElementById('pFront');
const ctxB   = cBack.getContext('2d');
const ctxF   = cFront.getContext('2d');
const reduced = matchMedia('(prefers-reduced-motion:reduce)').matches;
let W, H;

/* ── Soft center attenuation ── */
let zCx=0, zCy=0, zRx=0, zRy=0;

function calcCenter(){
  const mono = document.querySelector('.monogram');
  const typo = document.querySelector('.typography');
  if(!mono||!typo) return;
  const mr = mono.getBoundingClientRect();
  const tr = typo.getBoundingClientRect();
  const top = Math.min(mr.top, tr.top);
  const bot = Math.max(mr.bottom, tr.bottom);
  const lft = Math.min(mr.left, tr.left);
  const rgt = Math.max(mr.right, tr.right);
  zCx = (lft+rgt)/2;
  zCy = (top+bot)/2;
  zRx = (rgt-lft)/2 + W*.18;
  zRy = (bot-top)/2 + H*.14;
}

function atten(px,py,minMul){
  const dx = (px-zCx)/zRx;
  const dy = (py-zCy)/zRy;
  const d = dx*dx+dy*dy;
  if(d >= 1) return 1;
  const t = Math.sqrt(d);
  const smooth = t*t*(3-2*t);
  return minMul + (1-minMul)*smooth;
}

function resize(){
  W = cBack.width = cFront.width = innerWidth;
  H = cBack.height = cFront.height = innerHeight;
  calcCenter();
}
addEventListener('resize', resize);
resize();
document.fonts.ready.then(()=> setTimeout(calcCenter, 100));

const COL = [
  [232,207,160],
  [220,195,140],
  [240,225,190],
  [245,235,205],
  [255,245,215],
];
const BOKEH_COL = [
  [218,175,82],
  [205,160,65],
  [230,185,90],
  [200,150,55],
  [215,168,72],
  [225,178,68],
];
function rCol(){ return COL[Math.random()*COL.length|0]; }
function rBokeh(){ return BOKEH_COL[Math.random()*BOKEH_COL.length|0]; }

/* Edge-biased X for bokeh: always in outer edges, never center */
function edgeX(){
  return Math.random()<.5
    ? Math.random()*.28*W - 30
    : W*.72 + Math.random()*.28*W + 30;
}

/* ═══ LAYER 1 — Background (many tiny, slow, minimal drift) ═══ */
const BG_COUNT = 500;
const bgParts = [];

function spawnBG(randomY){
  return {
    x: Math.random()*W,
    y: randomY ? Math.pow(Math.random(),.7)*H : -(Math.random()*40+5),
    r: .4 + Math.random()*2.5,
    a: .35 + Math.random()*.6,
    vy: .12 + Math.random()*.3,
    vx: (Math.random()-.5)*.015,
    c: rCol()
  };
}
for(let i=0;i<BG_COUNT;i++) bgParts.push(spawnBG(true));

/* ═══ LAYER 2 — Midground (fewer, brighter, moderate speed) ═══ */
const MID_COUNT = 120;
const midParts = [];

function spawnMID(randomY){
  return {
    x: Math.random()*W,
    y: randomY ? Math.random()*H : -(Math.random()*30+5),
    r: 1.5 + Math.random()*4,
    a: .25 + Math.random()*.4,
    vy: .3 + Math.random()*.45,
    vx: (Math.random()-.5)*.06,
    c: rCol()
  };
}
for(let i=0;i<MID_COUNT;i++) midParts.push(spawnMID(true));

/* ═══ LAYER 3 — Foreground bokeh (edge-biased, three size tiers) ═══ */
const FG_VLARGE = 1;   // very large: 35-55px
const FG_LARGE  = 8;   // large: 22-38px
const FG_MED    = 15;  // medium: 12-26px
const fgParts = [];

function spawnFG(randomY, size){
  const r = size==='vl' ? 35+Math.random()*20
          : size==='lg' ? 22+Math.random()*16
          :               12+Math.random()*14;
  const a = size==='vl' ? .35 + Math.random()*.15
          : size==='lg' ? .5 + Math.random()*.2
          :               .85 + Math.random()*.15;
  return {
    x: edgeX(),
    y: randomY ? Math.random()*H : -(r + Math.random()*80),
    r: r, size: size,
    a: a,
    vy: .35 + Math.random()*.45,
    vx: (Math.random()-.5)*.1,
    c: rBokeh()
  };
}
for(let i=0;i<FG_VLARGE;i++) fgParts.push(spawnFG(true,'vl'));
for(let i=0;i<FG_LARGE;i++)  fgParts.push(spawnFG(true,'lg'));
for(let i=0;i<FG_MED;i++)    fgParts.push(spawnFG(true,'md'));

/* ═══ TWINKLES — stationary warm points ═══ */
const TW_COUNT = 18;
const twinkles = [];
function ease(t){ return t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2; }

for(let i=0;i<TW_COUNT;i++){
  twinkles.push({
    x: Math.random()*W, y: Math.random()*H,
    r: .5+Math.random()*1.5,
    base: .1+Math.random()*.12, peak: .45+Math.random()*.45,
    a: .1+Math.random()*.12,
    state:'idle', wait:Math.random()*5000+1500,
    dur:2000+Math.random()*3000, elapsed:0,
    c: rCol()
  });
}

/* ── Drawing helpers ── */
function drawDot(ctx,x,y,r,c,a){
  ctx.beginPath();
  ctx.arc(x,y,r,0,Math.PI*2);
  ctx.fillStyle=`rgba(${c[0]},${c[1]},${c[2]},${a})`;
  ctx.fill();
}

function drawGlow(ctx,x,y,r,c,a){
  const g = ctx.createRadialGradient(x,y,0,x,y,r);
  g.addColorStop(0,`rgba(${c[0]},${c[1]},${c[2]},${a})`);
  g.addColorStop(.3,`rgba(${c[0]},${c[1]},${c[2]},${a*.6})`);
  g.addColorStop(1,`rgba(${c[0]},${c[1]},${c[2]},0)`);
  ctx.beginPath();
  ctx.arc(x,y,r,0,Math.PI*2);
  ctx.fillStyle=g;
  ctx.fill();
}

function drawBokeh(ctx,x,y,r,c,a){
  const g = ctx.createRadialGradient(x,y,0,x,y,r);
  g.addColorStop(0,`rgba(${c[0]},${c[1]},${c[2]},${a})`);
  g.addColorStop(.65,`rgba(${c[0]},${c[1]},${c[2]},${a*.85})`);
  g.addColorStop(.82,`rgba(${c[0]},${c[1]},${c[2]},${a*.4})`);
  g.addColorStop(.93,`rgba(${c[0]},${c[1]},${c[2]},${a*.1})`);
  g.addColorStop(1,`rgba(${c[0]},${c[1]},${c[2]},0)`);
  ctx.beginPath();
  ctx.arc(x,y,r,0,Math.PI*2);
  ctx.fillStyle=g;
  ctx.fill();
}

/* ── Main loop ── */
let prev = 0;

function frame(t){
  if(reduced){ drawStatic(); return; }
  const dt = Math.min(t-prev,50);
  prev = t;
  const s = dt/16.667;

  ctxB.clearRect(0,0,W,H);
  ctxF.clearRect(0,0,W,H);

  /* Layer 1: Background — slow downward, minimal drift */
  for(let i=0;i<bgParts.length;i++){
    const p = bgParts[i];
    p.y += p.vy*s;
    p.x += p.vx*s;
    if(p.y > H+5){ bgParts[i]=spawnBG(false); continue; }
    const ba=atten(p.x,p.y,0); if(ba>0) drawDot(ctxB,p.x,p.y,p.r,p.c,p.a*ba);
  }

  /* Layer 2: Midground — moderate downward, slight drift */
  for(let i=0;i<midParts.length;i++){
    const p = midParts[i];
    p.y += p.vy*s;
    p.x += p.vx*s;
    if(p.y > H+10){ midParts[i]=spawnMID(false); continue; }
    const ma=atten(p.x,p.y,0); if(ma>0) drawGlow(ctxB,p.x,p.y,p.r*2,p.c,p.a*ma);
  }

  /* Twinkles */
  let twA=0;
  for(let i=0;i<twinkles.length;i++) if(twinkles[i].state!=='idle') twA++;
  for(let i=0;i<twinkles.length;i++){
    const tw=twinkles[i];
    if(tw.state==='idle'){
      tw.wait-=dt;
      if(tw.wait<=0&&twA<6){tw.state='brighten';tw.elapsed=0;tw.dur=2500+Math.random()*3000;twA++;}
      tw.a=tw.base;
    } else if(tw.state==='brighten'){
      tw.elapsed+=dt;
      const p=Math.min(tw.elapsed/tw.dur,1);
      tw.a=tw.base+(tw.peak-tw.base)*ease(p);
      if(p>=1){tw.state='dim';tw.elapsed=0;tw.dur=2500+Math.random()*3000;}
    } else {
      tw.elapsed+=dt;
      const p=Math.min(tw.elapsed/tw.dur,1);
      tw.a=tw.peak-(tw.peak-tw.base)*ease(p);
      if(p>=1){tw.state='idle';tw.wait=3000+Math.random()*6000;twA--;}
    }
    const ta=atten(tw.x,tw.y,0); if(ta>0) drawDot(ctxB,tw.x,tw.y,tw.r,tw.c,Math.max(0,Math.min(1,tw.a))*ta);
  }

  /* Layer 3: Foreground bokeh — slightly faster, gentle drift */
  for(let i=0;i<fgParts.length;i++){
    const p = fgParts[i];
    p.y += p.vy*s;
    p.x += p.vx*s;
    if(p.y > H+p.r+20){ fgParts[i]=spawnFG(false,p.size); continue; }
    const fa=atten(p.x,p.y,0); if(fa>0) drawBokeh(ctxF,p.x,p.y,p.r,p.c,p.a*fa);
  }

  requestAnimationFrame(frame);
}

function drawStatic(){
  ctxB.clearRect(0,0,W,H); ctxF.clearRect(0,0,W,H);
  for(const p of bgParts) drawDot(ctxB,p.x,p.y,p.r,p.c,p.a*.4);
  for(const p of midParts) drawGlow(ctxB,p.x,p.y,p.r*2,p.c,p.a*.4);
  for(const tw of twinkles) drawDot(ctxB,tw.x,tw.y,tw.r,tw.c,tw.base);
  for(const p of fgParts) drawBokeh(ctxF,p.x,p.y,p.r,p.c,p.a*.4);
}

requestAnimationFrame(frame);

document.querySelector('.monogram').addEventListener('animationend',function(){
  this.style.opacity='1';
  this.style.transform='translate(-50%,-50%) scale(1)';
  this.style.filter='drop-shadow(0 0 5px rgba(240,220,170,.32)) drop-shadow(0 0 14px rgba(232,207,160,.25)) drop-shadow(0 0 35px rgba(220,190,130,.18)) drop-shadow(0 0 65px rgba(200,170,100,.08))';
  this.style.animation='monoGlow 7s ease-in-out infinite';
});
</script>

</body>
</html>
